name: vliw-919-recover

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover public VLIW laboratory through REST and codeload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO='josusanmartin/original_performance_takehome'
          API="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          echo '=== REPOSITORY API ==='
          curl -sS -D /tmp/h "${auth[@]}" "$API" -o /tmp/repo.json || true
          cat /tmp/h
          cat /tmp/repo.json

          echo '=== BRANCH API ==='
          curl -sS "${auth[@]}" "$API/branches?per_page=100" || true

          echo '=== CODELOAD TESTS ==='
          for ref in main sub924-lab chatgpt/deletion-search-20260726; do
            url="https://codeload.github.com/$REPO/zip/refs/heads/$ref"
            echo "--- $url"
            curl -sS -L -D "/tmp/${ref//\//_}.hdr" "$url" -o "/tmp/${ref//\//_}.zip" || true
            cat "/tmp/${ref//\//_}.hdr"
            ls -l "/tmp/${ref//\//_}.zip" || true
            file "/tmp/${ref//\//_}.zip" || true
          done

          echo '=== KNOWN RUN JOBS AND LOGS ==='
          for run in 30193242397 30192690273 30192274079; do
            echo "--- RUN $run"
            curl -sS "${auth[@]}" "$API/actions/runs/$run" || true
            curl -sS "${auth[@]}" "$API/actions/runs/$run/jobs?per_page=100" -o "/tmp/jobs-$run.json" || true
            cat "/tmp/jobs-$run.json"
            python - "$run" <<'PY'
          import json,sys
          run=sys.argv[1]
          try:
              data=json.load(open(f'/tmp/jobs-{run}.json'))
          except Exception:
              raise SystemExit
          for job in data.get('jobs',[]):
              print(job.get('id'))
          PY
            for job in $(python - "$run" <<'PY'
          import json,sys
          run=sys.argv[1]
          try:data=json.load(open(f'/tmp/jobs-{run}.json'))
          except Exception:raise SystemExit
          for j in data.get('jobs',[]):print(j['id'])
          PY
            ); do
              echo "--- JOB LOG $job"
              curl -sS -L "${auth[@]}" "$API/actions/jobs/$job/logs" -o "/tmp/job-$job.log" || true
              ls -l "/tmp/job-$job.log" || true
              file "/tmp/job-$job.log" || true
              head -c 200000 "/tmp/job-$job.log" || true
            done
          done

          echo '=== CONTENTS API KNOWN REFS ==='
          for ref in main sub924-lab chatgpt/deletion-search-20260726 sub924-drive-fetch; do
            echo "--- REF $ref workflows"
            curl -sS "${auth[@]}" "$API/contents/.github?ref=$ref" || true
            curl -sS "${auth[@]}" "$API/contents/.github/workflows?ref=$ref" || true
            echo
          done
