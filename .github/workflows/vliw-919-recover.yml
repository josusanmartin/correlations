name: vliw-919-recover

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Public VLIW recovery summary
        shell: bash
        run: |
          set -u
          REPO='josusanmartin/original_performance_takehome'
          API="https://api.github.com/repos/$REPO"
          echo '=== HTTP STATUS ==='
          for url in \
            "$API" \
            "$API/branches?per_page=100" \
            "https://codeload.github.com/$REPO/zip/refs/heads/main" \
            "https://codeload.github.com/$REPO/zip/refs/heads/sub924-lab" \
            "https://raw.githubusercontent.com/$REPO/main/problem.py"; do
            code=$(curl -L -sS -o /tmp/out -w '%{http_code}' "$url" || true)
            echo "$code $(wc -c </tmp/out 2>/dev/null || echo 0) $url"
            head -c 160 /tmp/out | tr '\n' ' '; echo
          done

          echo '=== RUN LOG URL EXTRACTION ==='
          for run in 30193242397 30192690273 30192274079; do
            code=$(curl -sS -o /tmp/jobs.json -w '%{http_code}' "$API/actions/runs/$run/jobs?per_page=100" || true)
            echo "RUN $run JOBS_HTTP $code"
            python - "$run" <<'PY'
          import json,sys
          run=sys.argv[1]
          try:data=json.load(open('/tmp/jobs.json'))
          except Exception as e:
              print('PARSE_ERROR',e);raise SystemExit
          for j in data.get('jobs',[]):print('JOB',j.get('id'),j.get('name'))
          PY
            for job in $(python - <<'PY'
          import json
          try:data=json.load(open('/tmp/jobs.json'))
          except Exception:raise SystemExit
          for j in data.get('jobs',[]):print(j.get('id'))
          PY
            ); do
              code=$(curl -L -sS -o /tmp/job.log -w '%{http_code}' "$API/actions/jobs/$job/logs" || true)
              echo "JOB $job LOG_HTTP $code BYTES $(wc -c </tmp/job.log 2>/dev/null || echo 0)"
              strings /tmp/job.log | grep -Eio 'https?://[^ ]+|drive[^ ]+|gist[^ ]+|checkpoint[^ ]+|[A-Za-z0-9_-]{20,}' | grep -Ei 'drive|gist|checkpoint|google|githubusercontent' | head -100 || true
            done
          done

          echo '=== WORKFLOW CONTENTS ==='
          for ref in main sub924-lab chatgpt/deletion-search-20260726 sub924-drive-fetch; do
            code=$(curl -sS -o /tmp/contents.json -w '%{http_code}' "$API/contents/.github/workflows?ref=$ref" || true)
            echo "REF $ref HTTP $code"
            python - <<'PY'
          import json
          try:data=json.load(open('/tmp/contents.json'))
          except Exception as e:print('PARSE_ERROR',e);raise SystemExit
          if isinstance(data,list):
              for x in data:print(x.get('name'),x.get('download_url'))
          else:print(data)
          PY
          done
