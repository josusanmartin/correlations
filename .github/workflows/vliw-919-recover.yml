name: vliw-919-recover

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve secret gist and inspect readable 924
        shell: bash
        run: |
          set -euxo pipefail
          GID='98d1ba6e26ddd17078e4cff7880bef4d'
          curl -LsSf "https://api.github.com/gists/$GID" -o /tmp/gist.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gist.json'))
          print('DESCRIPTION',d.get('description'),'PUBLIC',d.get('public'))
          for name,f in d.get('files',{}).items():
              print('FILE',name,'SIZE',f.get('size'),'TRUNC',f.get('truncated'),'RAW',f.get('raw_url'))
          for h in d.get('history',[]):
              print('HISTORY',h.get('version'),h.get('committed_at'))
          PY
          raw=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/gist.json'))
          candidates=[f for n,f in d['files'].items() if n.endswith('.py')]
          print(candidates[0]['raw_url'])
          PY
          )
          curl -LsSf "$raw" -o /tmp/perf924.py
          curl -LsSf 'https://raw.githubusercontent.com/anthropics/original_performance_takehome/main/problem.py' -o /tmp/problem.py
          cat >/tmp/inspect.py <<'PY'
          import importlib.util,sys
          sys.path.insert(0,'/tmp')
          s=importlib.util.spec_from_file_location('p924','/tmp/perf924.py')
          m=importlib.util.module_from_spec(s);sys.modules['p924']=m;s.loader.exec_module(m)
          print('IDENTITY',getattr(m,'BUILD_ID',None),getattr(m,'EXPECTED_CYCLES',None),getattr(m,'EXPECTED_PROGRAM_LEN',None),getattr(m,'EXPECTED_SCRATCH',None))
          for name in sorted(dir(m)):
              if any(k in name.upper() for k in ('HOT','TABLE','SPEC','CHAIN','TEMPLATE','BASE')):
                  v=getattr(m,name)
                  try:n=len(v)
                  except Exception:n=None
                  print('GLOBAL',name,type(v).__name__,n)
          hot=m.HOT_PROGRAM;temps=m.PAIR_TABLE_TEMPLATES
          print('HOT_LEN',len(hot),'TEMPLATES',len(temps))
          print('TEMPLATE_FIRST',repr(temps[0])[:1200])
          print('TEMPLATE_LAST',repr(temps[-1])[:1200])
          print('HOT_FLOW')
          for pc,b in enumerate(hot):
              d=dict(b)
              for slot in d.get('flow',()):
                  if slot[0] in ('jump_indirect','jump','add_imm','halt','pause'):
                      print(pc,repr(slot))
          print('TEMPLATE_FLOWS')
          for i,t in enumerate(temps):
              d=dict(t)
              if d.get('flow'):print(i,repr(d['flow']))
          for name in sorted(dir(m)):
              if name.startswith('_') or name in ('HOT_PROGRAM','PAIR_TABLE_TEMPLATES'):continue
              v=getattr(m,name)
              if isinstance(v,(tuple,list,dict)):
                  r=repr(v)
                  if len(r)<8000:print('META',name,r)
          kb=m.KernelBuilder();kb.build_kernel(10,2047,256,16)
          print('BUILT',type(kb.instrs).__name__,len(kb.instrs),kb.scratch_ptr)
          PY
          python /tmp/inspect.py
